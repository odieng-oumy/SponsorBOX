# Configuration du serveur
server.port=8080
spring.application.name=sponsorbox-backend

# Configuration MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/sponsorbox_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=SponsorBoxSecretKey2024SponsorBoxSecretKey2024SponsorBox
jwt.expiration=86400000
